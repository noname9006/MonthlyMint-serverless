<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonthlyMint - Budget Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .mint-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .status {
            background: #e7f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .status-text {
            color: #2e7d32;
            font-weight: 500;
        }
        
        .api-test {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        #api-result {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mint-icon">🌿</div>
        <h1>MonthlyMint</h1>
        <div class="status">
            <p class="status-text">✓ Application Successfully Deployed!</p>
        </div>
        <p>Your serverless budget tracking application is now live and ready to help you manage your finances.</p>
        
        <div class="api-test">
            <h3>Test API Connection</h3>
            <button onclick="testAPI()">Test Serverless Function</button>
            <div id="api-result"></div>
        </div>
    </div>
    
    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.textContent = 'Testing...';
            
            try {
                const response = await fetch('/api/hello');
                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
                resultDiv.style.color = '#4caf50';
            } catch (error) {
                resultDiv.textContent = 'Error: ' + error.message;
                resultDiv.style.color = '#f44336';
            }
        }
    </script>
</body>
</html>
